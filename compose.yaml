services:
  db:
    container_name: isofactu-db
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isofactu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vG7r9yL2qP4sZ8wHPt3KcR1u}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    ports:
      - "127.0.0.1:5433:5433"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-isofactu}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  database_data:
